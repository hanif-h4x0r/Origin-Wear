<!DOCTYPE html>
<html>
    <head>
        <title>Origin Wear Shop</title>
        <style>
            .menu-btn {position: fixed; top: 10px; left: 10px; z-index: 2; font-size: 24px; cursor: pointer; background: none; border: none;}
            .sidebar {position: fixed; top: 0; left: 0; width: 200px; height: 100%; background: #f0f0f0; transform: translateX(-100%); transition: transform 0.3s; z-index: 1; padding-top: 50px; }
            .sidebar.open {transform: translateX(0);}
            .sidebar a {display: block; padding: 10px 20px; text-decoration: none; color: black;}
            .card {border: 1px solid #ddd;}
            .card h3 {margin: 0 0 8px 0;}
            .card p {margin: 0;}
            .content {margin-left: 60px; padding: 20px;}
        </style>
    </head>
    <body>
        <button class="menu-btn" onclick="toggleMenu()">&#9776;</button>
        <div class="sidebar" id="sidebar">
            <a href="/">Home</a>
            <a href="/products">Products</a>
        </div>
        <div class="content">
            {% block content %}{% endblock %}
        </div>
        <script>
            function toggleMenu() {
                document.getElementById("sidebar").classList.toggle("open");
            }
        </script>
    </body>
</html>
